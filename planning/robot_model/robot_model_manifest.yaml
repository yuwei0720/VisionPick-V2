blocking_reasons:
- Official adaptive-gripper URDF/xacro and meshes have not yet been snapshotted, hashed,
  and compared with the installed gripper.
- The installed gripper adapter/connector geometry has not been physically measured.
- Joint order/sign/zero mapping between pymycobot and the vendor URDF has not passed
  the hardware blocking test.
- The vendor arm URDF/meshes have not yet been snapshotted, hashed, and reviewed on
  the target ROS 2 host.
- No hardware-verified SRDF self-collision matrix exists yet.
- Collision padding has not been derived from physical measurements.
notes:
- Robot body identity is fixed to Elephant Robotics myCobot 280 M5.
- End effector identity is fixed to the official Elephant Robotics myCobot Adaptive
  Gripper.
- RealSense is external to the robot and must not be attached as a robot link; it
  belongs to the workcell/planning scene if its geometry is relevant.
- The official ROS 2 Humble arm and adaptive-gripper descriptions are candidate baselines,
  not safety approval.
- Do not set verified=true merely because the vendor model loads in RViz.
